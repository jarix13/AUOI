kind = "web"
previewPath = "/"
title = "BYDAUTO.AE"
version = "1.0.0"
id = "artifacts/bydauto"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20916

[services.development]
run = "pnpm --filter @workspace/bydauto run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bydauto", "run", "build" ]
serve = "static"
publicDir = "artifacts/bydauto/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20916"
BASE_PATH = "/"
